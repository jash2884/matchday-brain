<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matchday Brain</title>
  <meta name="description" content="Multi-sport match predictions from tuned Elo models, with honest, publicly scored accuracy. Football, cricket and the NFL." />
  <meta name="theme-color" content="#070b16" />
  <meta property="og:title" content="Matchday Brain: predictions that show their homework" />
  <meta property="og:description" content="Football, cricket and NFL predictions with a public track record." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23070b16'/><path d='M7 22l5-12 4 8 3-5 6 9' stroke='%2322e57a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-sport="football">
  <header class="masthead">
    <div class="wrap mast-inner">
      <a class="logo" href="#/" aria-label="Matchday Brain home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 23l6-14 5 9 3-6 8 11" /></svg>
        <span>MATCHDAY<b>BRAIN</b></span>
      </a>
      <nav class="sports" aria-label="Sport"></nav>
    </div>
    <div class="ticker" aria-label="Latest results"><div class="ticker-track" id="ticker"></div></div>
  </header>

  <main class="wrap">
    <section class="comp-head">
      <div>
        <div class="eyebrow" id="comp-region">&nbsp;</div>
        <h1 id="comp-name">Loading…</h1>
        <div class="comp-meta" id="comp-meta"></div>
      </div>
      <div class="comps" id="comps" role="tablist" aria-label="Competition"></div>
    </section>

    <nav class="views" aria-label="View">
      <button data-view="predictions">Predictions</button>
      <button data-view="h2h">Head-to-head</button>
      <button data-view="ratings">Power ratings</button>
      <button data-view="record">Track record</button>
      <button data-view="method">Method &amp; API</button>
    </nav>

    <div id="error" class="error" role="alert" hidden></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <footer class="wrap foot">
    <span>Matchday Brain &middot; built by <a href="https://jashparmar.com">Jash Parmar</a> &middot; <a href="https://github.com/jash2884/matchday-brain">source</a></span>
    <span id="foot-source"></span>
    <span class="muted">For analysis and fun, not betting advice.</span>
  </footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
